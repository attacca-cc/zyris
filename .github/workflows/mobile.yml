name: Mobile

# The phone apps: an Android APK and an iOS build of the same window, a typed conversation (see
# `crates/zyris-app/src/mobile.rs`). A `v*` tag attaches them to that tag's release; a manual run
# builds them, and attaches them to the release named in `release` when one is given.
on:
  push:
    tags:
      - "v*"
  # A pull request that touches the phone build checks it, and publishes nothing.
  pull_request:
    paths:
      - "crates/zyris-app/src/mobile.rs"
      - "crates/zyris-app/src/lib.rs"
      - "crates/zyris-app/Cargo.toml"
      - "crates/zyris-app/tauri.conf.json"
      - "crates/zyris-voice/src/chat.rs"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the builds to this existing release tag (leave empty to only build)"
        required: false
        default: ""

concurrency:
  group: mobile-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  LIBONNXRUNTIME_NO_PKG_CONFIG: "1"

permissions:
  contents: write

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # arm64 only: every phone sold in the last several years, and a quarter of the build time.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - run: pnpm install --frozen-lockfile

      # The runner image carries the SDK and several NDKs; Tauri reads NDK_HOME.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # The Gradle project is generated rather than committed: it is Tauri's template and the
      # identifier in tauri.conf.json, nothing of ours.
      - name: Generate the Android project
        run: pnpm tauri android init --ci

      - name: Build the APK
        run: pnpm tauri android build --apk --target aarch64 --ci

      # Signed with the release key in the repository's secrets, so every later version installs
      # over this one. Without the key the build is still checked, and nothing is published.
      - name: Sign
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=$(find crates/zyris-app/gen/android -name '*-release-unsigned.apk' | head -1)
          echo "unsigned: $apk"
          version=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' crates/zyris-app/tauri.conf.json | head -1)
          mkdir -p out
          if [ -z "${KEYSTORE:-}" ]; then
            echo "no release key in the secrets; the APK is not signed or published"
            cp "$apk" "out/Zyris_${version}_arm64-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE" | base64 -d > release.jks
          "$tools/zipalign" -p -f 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "out/Zyris_${version}_arm64.apk" aligned.apk
          "$tools/apksigner" verify --print-certs "out/Zyris_${version}_arm64.apk" | head -3
          rm release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: zyris-android
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: steps.sign.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          files: out/*.apk
          fail_on_unmatched_files: true

  ios:
    name: ios
    runs-on: macos-latest
    env:
      # Whether there is a signing team at all. Its own name, because a step that sets the
      # team itself (the placeholder below) would change what its own `if` reads.
      SIGNED: ${{ secrets.APPLE_DEVELOPMENT_TEAM != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - run: pnpm install --frozen-lockfile

      # `init` refuses to write a project with no development team, even one only ever built for
      # the simulator, which signs nothing. Without the secret it gets a placeholder that never
      # reaches a signing step.
      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'SIMULATOR0' }}
        run: pnpm tauri ios init --ci

      # **An iPhone runs only what Apple has signed for it**, and signing for the App Store needs
      # the account's team, certificate and provisioning profile. Without them the app is built
      # for devices with signing switched off, and the archive's app is packed as an unsigned IPA:
      # a person installs it with AltStore or Sideloadly, which sign it with their own Apple ID.
      # The export step that follows the archive needs signing and fails; the archive is what is
      # kept.
      - name: Build an unsigned IPA (no signing identity)
        if: env.SIGNED != 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: SIMULATOR0
        run: |
          set -uo pipefail
          # Signing off in the project itself: an xcconfig passed from outside does not stop
          # Xcode's automatic signing asking for an account and a provisioning profile.
          project=crates/zyris-app/gen/apple/zyris-app.xcodeproj/project.pbxproj
          sed -i '' -e 's/DEVELOPMENT_TEAM = SIMULATOR0;/DEVELOPMENT_TEAM = ""; CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; PROVISIONING_PROFILE_SPECIFIER = "";/' "$project"
          sed -i '' -e 's/CODE_SIGN_STYLE = Automatic;//' "$project"
          grep -c "CODE_SIGNING_ALLOWED = NO" "$project"
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nDEVELOPMENT_TEAM =\nCODE_SIGN_STYLE = Manual\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig"
          pnpm tauri ios build --target aarch64 --ci || echo "the export needs signing; keeping the archive"
          set -e
          archive=$(find crates/zyris-app/gen/apple -name '*.xcarchive' -type d | head -1)
          echo "archive: $archive"
          app=$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          version=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' crates/zyris-app/tauri.conf.json | head -1)
          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry "Zyris_${version}_ios-unsigned.ipa" Payload && rm -rf Payload)
          ls -la out

      - name: Build the signed IPA
        if: env.SIGNED == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          pnpm tauri ios build --export-method app-store-connect --ci
          mkdir -p out && find crates/zyris-app/gen/apple -name '*.ipa' -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: zyris-ios
          path: out/*.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          files: out/*.ipa
          fail_on_unmatched_files: true
