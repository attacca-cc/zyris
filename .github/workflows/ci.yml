name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and Linux fail for unrelated reasons; seeing only the first one is no help.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # `zyris-input` is a git dependency and the three `[patch.crates-io]` entries point at the
      # same repository, so cargo needs network git access, not just a registry fetch. There are
      # no submodules.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `libasound2-dev` and `libclang-dev` at the end are the voice build's, and nothing
          # else here needs them: `cpal` depends on `alsa-sys` unconditionally on Linux, and
          # both `whisper-rs-sys` and `pipewire-sys` generate their bindings with `bindgen`,
          # which needs a real `libclang.so` — the runner image ships clang without the `-dev`
          # package that carries it.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libatk1.0-dev \
            librsvg2-dev \
            zlib1g-dev \
            libssl-dev \
            libayatana-appindicator3-1 \
            libpipewire-0.3-dev \
            libgbm-dev \
            libasound2-dev \
            libclang-dev \
            meson \
            ninja-build

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Caches `~/.cargo` and `target`. A cold build of this workspace is several minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # The discovery loop for the Linux system libraries is a sequence of failed builds;
          # without this each one starts from nothing.
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # `tauri-build` reads `ui/dist`, which is not committed. Without this the Rust build fails
      # with an error that never mentions the frontend.
      - run: pnpm --filter zyris-ui build

      # The window's own half of the peer-approval guard lives in TypeScript and nothing in the
      # Rust suite can reach it: which buttons are live in the instant a question is replaced is
      # decided by a React effect. Run before the Rust suite, because it is seconds rather than
      # minutes and a failure here should not wait behind one.
      - run: pnpm --filter zyris-ui test

      - run: cargo test --workspace

      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        shell: pwsh
        # Both `whisper-rs-sys` and `pipewire-sys` generate their bindings with `bindgen`.
        # `clang-sys` looks for the library under `lib`; on this image the DLL is in `bin`.
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # **Without the step below the voice build is compiled by nothing.** `cargo test --workspace`
      # above passes no feature flags, and `release.yml` calls `pnpm tauri build` with none
      # either, so every line behind `voice` could rot for as long as it took somebody to turn
      # the flag on — which is the failure the whole layout of `zyris-voice` is arranged to
      # prevent, and it would be the one part of that arrangement nothing checked.
      #
      # A step in this job rather than a job of its own: the matrix is already both platforms,
      # and the system libraries, the frontend and the cargo cache are all already in place
      # here. A separate job would repeat every one of them and cold-build the workspace twice.
      #
      # `cargo test -p zyris-voice --features voice` and not just a build: it is the only thing
      # anywhere that runs the `#[cfg(feature = "voice")]` arm of `zyris_voice::start`.
      # `cargo build -p zyris-app --features voice` is what proves the forwarding — the
      # application's own feature is one line that must resolve, and a build of `zyris-voice`
      # alone would pass with it broken or deleted.
      #
      # **What this does not cover: `zyris-voice`'s `aec` feature**, and there is no honest way
      # to make it. `webrtc-audio-processing` 2.1 wants pkg-config `webrtc-audio-processing-2`
      # >= 2.1; noble — which *is* `ubuntu-latest` — ships 0.3.1 and no Debian or Ubuntu release
      # ships 2.x at all, so the package cannot be installed. Its `bundled` feature shells out
      # to `meson`, which is on neither runner. And on Windows upstream has no supported build:
      # issue #34 open since 2023-09-27, a CI matrix of `[ubuntu-latest, macos-latest]`, and the
      # MSVC pull request unmerged and unverified at runtime by its own author. So the echo
      # canceller is a separate feature that CI does not build, said out loud here rather than
      # hidden inside a job that looks like it covers everything. See `crates/zyris-voice/
      # Cargo.toml`.
      # **The echo canceller, statically linked, on Linux only.** Measured on a development
      # machine on 2026-09-19 rather than assumed: `webrtc-audio-processing`'s `bundled` feature
      # **does** build — 6m 02s — links **statically** (no `libwebrtc` in `ldd`, so the `.deb`
      # names nothing in `Depends:`), and passes the whole suite including the one test that
      # measures cancellation rather than compilation. Until today it had never been built on any
      # platform, and this file said so.
      #
      # All it ever needed was `meson` and `ninja`, which the apt line above now installs. What
      # made that look bigger than it was: no Debian or Ubuntu ships `webrtc-audio-processing`
      # 2.x, so the *system* library is genuinely unavailable — and `bundled` was written off with
      # it rather than tried separately.
      #
      # **Linux only, and that is upstream's position rather than ours**: issue #34 (Windows
      # build) has been open since 2023-09-27, the MSVC pull request is unmerged, and its author
      # says he has never verified the audio processing behaves correctly at run time. Windows
      # has its own canceller — `win_aec.rs`, the DSP that ships with the OS — which the step
      # above already compiles and runs.
      - name: Build the echo canceller
        if: runner.os == 'Linux'
        shell: bash
        env:
          GGML_NATIVE: "OFF"
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        run: |
          cargo test -p zyris-voice --features aec,webrtc-audio-processing/bundled

      - name: Build the voice feature
        env:
          # **`GGML_NATIVE` defaults to ON**, which bakes `-march=native` into whisper.cpp and
          # produces a binary that SIGILLs on any CPU older than the one that built it. No test
          # on the build machine can catch that, because the build machine is the one CPU it
          # works on. `whisper-rs-sys/build.rs` forwards any `WHISPER_`/`GGML_`/`CMAKE_`
          # environment variable to CMake, so this one line is the whole fix. AVX2 is still
          # required either way.
          #
          # Quoted, and that is not cosmetic: YAML 1.1 reads a bare `OFF` as the boolean false,
          # and the value that reached CMake would be the string `false`. It happens to mean the
          # same thing to CMake, which is exactly why an unquoted one would never be noticed.
          GGML_NATIVE: "OFF"
          # **`ort-sys` calls `pkg_config` before it considers `download-binaries`**, and this
          # file already carries the reason that is dangerous: `windows-latest` has Strawberry
          # Perl's `pkg-config.bat` on PATH, a pure-Perl reimplementation reporting version 0.26,
          # and the Rust `pkg-config` crate stopped skipping MSVC in 2018. So the voice build can
          # get a stale or imaginary `libonnxruntime` hit on Windows and link against nothing.
          # `<CRATE>_NO_PKG_CONFIG=1` is the documented guard; set on **both** runners so the two
          # build ONNX Runtime the same way — the way a release does, which is the pinned,
          # SHA-256-checked archive `ort-sys` downloads and links statically.
          #
          # CLAUDE.md said the only crate here that would call `pkg_config` is
          # `webrtc-audio-processing-sys`, behind `aec` and built nowhere. That stopped being
          # true the day `ort` arrived.
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        # **`bash`, and that is load-bearing on Windows.** The default shell there is `pwsh`,
        # which does not stop at a native command's non-zero exit — only the last command's
        # status decides the step. So a failing `cargo test` followed by a passing
        # `cargo build` reported this step green, and did: `the_readme_names_the_directory_the
        # _model_is_kept_in` failed on `windows-latest` for three runs while CI said success.
        # `bash` is `bash -e` on both runners and is present on the Windows image.
        shell: bash
        run: |
          cargo test -p zyris-voice --features voice
          cargo build -p zyris-app --features voice
