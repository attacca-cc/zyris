name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and Linux fail for unrelated reasons; seeing only the first one is no help.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # `zyris-input` is a git dependency and the three `[patch.crates-io]` entries point at the
      # same repository, so cargo needs network git access, not just a registry fetch. There are
      # no submodules.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libatk1.0-dev \
            librsvg2-dev \
            zlib1g-dev \
            libssl-dev \
            libayatana-appindicator3-1 \
            libpipewire-0.3-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Caches `~/.cargo` and `target`. A cold build of this workspace is several minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # The discovery loop for the Linux system libraries is a sequence of failed builds;
          # without this each one starts from nothing.
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # `tauri-build` reads `ui/dist`, which is not committed. Without this the Rust build fails
      # with an error that never mentions the frontend.
      - run: pnpm --filter zyris-ui build

      - run: cargo test --workspace
