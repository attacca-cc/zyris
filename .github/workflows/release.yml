name: Release

# A `v*` tag publishes a release with the `.deb` and the NSIS `.exe` attached. A manual run
# builds exactly the same bundles and stops at the artifacts, so the machinery can be exercised
# without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # Not `cancel-in-progress`: a half-uploaded release is worse than a slow one.
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # **The release path's half of the `GGML_NATIVE` rule**, and the only half a workflow can
  # carry. whisper.cpp's CMake defaults it ON, which compiles `-march=native` in and produces a
  # binary that dies with SIGILL — before `main`, with no message — on any CPU older than the
  # runner that built it. **No test can catch it**: the machine running the tests is the one CPU
  # where it works. `crates/zyris-voice/build.rs` refuses a release build without this, which is
  # what makes the rule survive somebody editing this file.
  #
  # **It reaches the bundles now** — they are built with `--features voice` since 2026-09-19, so
  # this is load-bearing rather than waiting. Quoted because YAML
  # 1.1 reads a bare `OFF` as the boolean false — which CMake happens to accept, which is
  # exactly why an unquoted one would never be noticed.
  #
  # **Not the whole rule on its own**: with `GGML_NATIVE` OFF, ggml compiles no instruction set
  # it is not named, and the bundles shipped a scalar whisper about ten times slower than it
  # should be. `.cargo/config.toml` names the AVX2 set for every build in this workspace, this
  # one included, and `crates/zyris-voice/build.rs` refuses a release without it.
  GGML_NATIVE: "OFF"
  # whisper.cpp uses std::filesystem, which Apple's libc++ offers from macOS 10.15, and the
  # compilers default lower. Every Apple Silicon Mac runs 11 or later. Read only by Apple targets.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Empty for Windows, which then runs on the host.
    container: ${{ matrix.container }}
    strategy:
      # One platform failing says nothing about the other, and both are wanted.
      fail-fast: false
      matrix:
        include:
          # **In Debian 12, not on the runner**: the binary asks for the glibc of the system that
          # built it, and 0.0.2 built on ubuntu-latest needed GLIBC_2.39 — nothing older than
          # Ubuntu 24.04 or Debian 13 could start it. Debian 12's 2.36 reaches Ubuntu 23.04+,
          # Mint 22 and Fedora 37+ as well. Ubuntu 22.04 was tried and cannot build this: its
          # PipeWire 0.3.48 is older than the headers libspa 0.10 (through xcap) needs, and
          # building against newer headers would make a binary its own PipeWire cannot start.
          - os: ubuntu-latest
            container: debian:bookworm
            artifact: zyris-linux
            # Speech, the echo canceller, and transcription on any Vulkan GPU. `aec` implies
            # `voice`; it is spelled out so a reader of this file can see it without opening a manifest.
            features: voice,aec,gpu-stt
            # Nothing to add to `tauri.conf.json` on Linux.
            config: ""
            # The filenames carry the version and the architecture, so glob rather than guess.
            bundles: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
          # Apple Silicon. whisper.cpp takes Metal there by default, so there is no `gpu` to add;
          # the AVX flags in .cargo/config.toml only mean anything on x86 and are ignored. Not
          # signed or notarised: the notes say how to open it the first time.
          - os: macos-latest
            artifact: zyris-macos
            features: voice,metal
            config: ""
            bundles: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: zyris-nsis
            # No `aec`: `webrtc-audio-processing` has no supported Windows build upstream. The
            # canceller Windows gets is `win_aec.rs`, the DSP that ships with the OS, which is
            # behind plain `voice` and needs nothing built.
            #
            # **`gpu` on Windows**: whisper through Vulkan and the voice through WebGPU on
            # Direct3D 12. Without it an RTX 3050 sat idle while the processor took ten seconds
            # a sentence for Large v3 Turbo. The WebGPU build of ONNX Runtime is three DLLs
            # beside the executable — Dawn and the two DirectX shader compilers it loads — and
            # `zyris.exe` will not start without the first of them, so the installer has to
            # carry all three; that is what the extra config does.
            features: voice,gpu
            config: --config crates/zyris-app/tauri.windows-gpu.conf.json
            bundles: target/release/bundle/nsis/*.exe

    steps:
      # `zyris-input` is a git dependency and the three `[patch.crates-io]` entries point at the
      # same repository, so cargo needs network git access. There are no submodules.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # A tag names a version and `tauri.conf.json` hard-codes one, and it is the file the
      # bundler stamps the filenames from — never the tag. Tag `v0.2.0` without editing it and
      # this workflow cheerfully publishes a release called v0.2.0 whose every asset is
      # `Zyris_0.1.0_*`, which is not a thing anybody can undo after the fact.
      #
      # First step after the checkout, so a mismatch costs a few seconds rather than two full
      # bundle builds. `sed` rather than `jq` or `node`, so it needs nothing installed and runs
      # the same on both runners.
      - name: Check the tag against the version the bundles will carry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          config=crates/zyris-app/tauri.conf.json
          configured=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$config" | head -1)
          # **The pre-release suffix is release metadata, not a bundle version.** A tag of
          # v0.0.1-pre-alpha.1 publishes assets stamped 0.0.1, and that is right: the suffix
          # says how finished the release is, and the installers carry the version of the thing
          # inside them. Comparing the whole tag refused exactly that, which is how this was
          # found. What the guard is for is unchanged — a tag claiming one version must not
          # attach assets stamped another — so the release part is still compared exactly.
          release=${GITHUB_REF_NAME#v}
          version=${release%%-*}
          if [ "$version" != "$configured" ]; then
            echo "tag ${GITHUB_REF_NAME} would publish assets stamped ${configured:-<nothing>}; edit \"version\" in ${config} or retag" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches \"version\": \"${configured}\" in ${config}"

      # The same list `ci.yml` installs, arrived at by building rather than guessing. The last
      # four are the voice build's: `libasound2-dev` because cpal depends on `alsa-sys`
      # unconditionally here, `libclang-dev` because `whisper-rs-sys` and `pipewire-sys` both run
      # `bindgen` and the runner ships clang without the `.so`, and `meson`/`ninja-build` because
      # the echo canceller is vendored — no Debian or Ubuntu ships `webrtc-audio-processing` 2.x,
      # so there is no system copy to link against and a `.deb` could not name one.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          # Root and no sudo in the container; the tools a runner image has and Debian does not.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake clang file \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libatk1.0-dev \
            librsvg2-dev \
            zlib1g-dev \
            libssl-dev \
            libayatana-appindicator3-1 \
            libpipewire-0.3-dev \
            libgbm-dev \
            libasound2-dev \
            libclang-dev \
            libvulkan-dev \
            glslc \
            ninja-build \
            python3-pip
          # Meson from PyPI: the echo canceller's build runs `meson setup --reconfigure` on a
          # fresh directory, which Debian 12's meson 1.0 refuses ("does not contain a valid build
          # tree") and newer ones accept.
          $SUDO pip3 install --break-system-packages 'meson>=1.3'
          # Vulkan headers newer than Debian 12's 1.3.239: ggml-vulkan uses VK_EXT_layer_settings.
          # Headers only, into /usr/local, which CMake searches before /usr; the loader stays
          # Debian's.
          curl -fsSL -o vulkan-headers.tar.gz https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.357.0.tar.gz
          echo "e87dce08116151f6b6d7de6b6faf41498e87e6cf848ff16fa3bd5402190ad4a3  vulkan-headers.tar.gz" | sha256sum -c -
          tar xzf vulkan-headers.tar.gz
          cmake -S Vulkan-Headers-vulkan-sdk-1.4.357.0 -B vulkan-headers -DCMAKE_INSTALL_PREFIX=/usr/local
          $SUDO cmake --install vulkan-headers
          rm -rf vulkan-headers.tar.gz Vulkan-Headers-vulkan-sdk-1.4.357.0 vulkan-headers

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A release build shares nothing with the debug build `ci.yml` caches, hence its own key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # `tauri.conf.json` runs `pnpm --filter zyris-ui build` as its `beforeBuildCommand`, which
      # is what puts `ui/dist` in place for `tauri-build`; it is not committed. No code signing:
      # it needs certificates nobody has, and the bundler's warning about that is expected.
      # clang-sys looks in `lib` and the runner image puts the DLL in `bin`. Windows-only rather
      # than in the job `env`: an empty value on Linux points clang-sys at nothing.
      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # `gpu-stt` compiles whisper.cpp's Vulkan backend: the headers, `vulkan-1.lib` and `glslc`
      # to compile its shaders, found through `VULKAN_SDK`, which this action sets.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true

      # **The C++ runtime the installer has to carry.** whisper.cpp and ONNX Runtime are C++ built
      # against the DLL runtime, so zyris.exe imports MSVCP140.dll and MSVCP140_1.dll, which a
      # fresh Windows does not have until something installs the Visual C++ redistributable.
      # 0.0.2's installer carried neither. Copied from the runner's System32 into target/vcruntime,
      # where tauri.windows-gpu.conf.json picks them up; Microsoft allows this app-local copy.
      - name: Put the Visual C++ runtime beside the build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # A folder of their own: tauri-build copies resources into target/release, and a
          # source already there is a copy onto itself, which Windows refuses (os error 32).
          mkdir -p target/vcruntime
          for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" target/vcruntime/
          done
          ls -la target/vcruntime

      # **Built once before the bundle, so the Dawn DLLs exist and can be staged.** ort-sys copies
      # them into target/release during the build, and tauri-build copies bundle resources into
      # the same directory in the same build: naming them where they land was a copy onto
      # itself, which Windows refuses (os error 32). The bundle build after this finds every
      # crate built and only reruns tauri-build, which then copies from target/gpu.
      - name: Build once and stage the GPU DLLs
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        run: |
          set -euo pipefail
          pnpm --filter zyris-ui build
          cargo build --release -p zyris-app --features ${{ matrix.features }},custom-protocol
          mkdir -p target/gpu
          for dll in webgpu_dawn.dll dxcompiler.dll dxil.dll; do
            cp "target/release/$dll" target/gpu/
          done
          ls -la target/gpu

      - name: Build the bundles
        shell: bash
        env:
          # `ort-sys` probes `pkg_config` for `libonnxruntime` before it considers downloading,
          # and a hit there links dynamically against a library the installer does not carry.
          # Forced off so the bundle links the statically-linked copy `ort` fetches — on both
          # runners, because `windows-latest` has Strawberry Perl's pure-Perl `pkg-config.bat`
          # on PATH and it answers.
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
          # Signs the updater artifacts (`createUpdaterArtifacts`) so an installed Zyris accepts
          # them; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --features ${{ matrix.features }} ${{ matrix.config }}

      - name: Report what the bundler produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(${{ matrix.bundles }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing matched ${{ matrix.bundles }}; the bundle tree holds:" >&2
            find target/release/bundle -type f >&2 || true
            exit 1
          fi
          {
            echo "| bundle | bytes |"
            echo "| --- | --- |"
            for f in "${files[@]}"; do
              echo "| $(basename "$f") | $(wc -c <"$f") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/*/*.sig
          if-no-files-found: error

  release:
    name: release
    needs: bundle
    # The tag is the only thing that publishes. A `workflow_dispatch` run never reaches this job,
    # so it cannot create a release — not even a draft one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Report what will be attached
        run: find bundles -type f -printf '%s\t%p\n'

      # What an installed Zyris reads to learn of this release: each platform's file and its
      # signature. The macOS archive is renamed with the version so two releases never share a
      # name.
      - name: Write latest.json for the updater
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each artifact keeps the bundler's layout: bundles/<artifact>/<kind>/<file>.
          for f in $(find bundles -name 'Zyris.app.tar.gz*'); do
            mv "$f" "${f/Zyris.app/Zyris_${TAG#v}_aarch64.app}"
          done
          entry() { # key file-glob
            local file sig
            file=$(find bundles -name "$2" | head -1); sig=$(cat "$file.sig")
            jq -n --arg sig "$sig" --arg url "https://github.com/$REPO/releases/download/$TAG/$(basename "$file")" \
              '{signature: $sig, url: $url}' | jq --arg k "$1" '{($k): .}'
          }
          {
            entry windows-x86_64-nsis '*_x64-setup.exe'
            entry windows-x86_64 '*_x64-setup.exe'
            entry darwin-aarch64-app '*_aarch64.app.tar.gz'
            entry darwin-aarch64 '*_aarch64.app.tar.gz'
            entry linux-x86_64-deb '*_amd64.deb'
            entry linux-x86_64-rpm '*.x86_64.rpm'
          } | jq -s --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, pub_date: $d, notes: "See the release notes on GitHub.", platforms: add}' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.exe
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.sig
            latest.json
          fail_on_unmatched_files: true
          draft: false
          # The merged pull requests since the last tag, as GitHub lists them.
          generate_release_notes: true
          # A tag carrying a pre-release suffix — v0.0.1-pre-alpha.1 — is marked as one, and a
          # plain v1.2.3 is not. Written out rather than left to the action inferring it,
          # because "is this a pre-release" is the one thing a person downloading it reads
          # first and it should not depend on a default.
          prerelease: ${{ contains(github.ref_name, '-') }}
