name: Release

# A `v*` tag publishes a release with the `.deb` and the NSIS `.exe` attached. A manual run
# builds exactly the same bundles and stops at the artifacts, so the machinery can be exercised
# without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # Not `cancel-in-progress`: a half-uploaded release is worse than a slow one.
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # **The release path's half of the `GGML_NATIVE` rule**, and the only half a workflow can
  # carry. whisper.cpp's CMake defaults it ON, which compiles `-march=native` in and produces a
  # binary that dies with SIGILL — before `main`, with no message — on any CPU older than the
  # runner that built it. **No test can catch it**: the machine running the tests is the one CPU
  # where it works. `crates/zyris-voice/build.rs` refuses a release build without this, which is
  # what makes the rule survive somebody editing this file.
  #
  # **It reaches the bundles now** — they are built with `--features voice` since 2026-09-19, so
  # this is load-bearing rather than waiting. Quoted because YAML
  # 1.1 reads a bare `OFF` as the boolean false — which CMake happens to accept, which is
  # exactly why an unquoted one would never be noticed.
  #
  # **Not the whole rule on its own**: with `GGML_NATIVE` OFF, ggml compiles no instruction set
  # it is not named, and the bundles shipped a scalar whisper about ten times slower than it
  # should be. `.cargo/config.toml` names the AVX2 set for every build in this workspace, this
  # one included, and `crates/zyris-voice/build.rs` refuses a release without it.
  GGML_NATIVE: "OFF"

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing says nothing about the other, and both are wanted.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zyris-deb
            # Speech, and the echo canceller with it. `aec` implies `voice`; it is spelled out
            # so a reader of this file can see both without opening a manifest.
            features: voice,aec
            # The filenames carry the version and the architecture, so glob rather than guess.
            bundles: target/release/bundle/deb/*.deb
          - os: windows-latest
            artifact: zyris-nsis
            # No `aec`: `webrtc-audio-processing` has no supported Windows build upstream. The
            # canceller Windows gets is `win_aec.rs`, the DSP that ships with the OS, which is
            # behind plain `voice` and needs nothing built.
            features: voice
            bundles: target/release/bundle/nsis/*.exe

    steps:
      # `zyris-input` is a git dependency and the three `[patch.crates-io]` entries point at the
      # same repository, so cargo needs network git access. There are no submodules.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # A tag names a version and `tauri.conf.json` hard-codes one, and it is the file the
      # bundler stamps the filenames from — never the tag. Tag `v0.2.0` without editing it and
      # this workflow cheerfully publishes a release called v0.2.0 whose every asset is
      # `Zyris_0.1.0_*`, which is not a thing anybody can undo after the fact.
      #
      # First step after the checkout, so a mismatch costs a few seconds rather than two full
      # bundle builds. `sed` rather than `jq` or `node`, so it needs nothing installed and runs
      # the same on both runners.
      - name: Check the tag against the version the bundles will carry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          config=crates/zyris-app/tauri.conf.json
          configured=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$config" | head -1)
          # **The pre-release suffix is release metadata, not a bundle version.** A tag of
          # v0.0.1-pre-alpha.1 publishes assets stamped 0.0.1, and that is right: the suffix
          # says how finished the release is, and the installers carry the version of the thing
          # inside them. Comparing the whole tag refused exactly that, which is how this was
          # found. What the guard is for is unchanged — a tag claiming one version must not
          # attach assets stamped another — so the release part is still compared exactly.
          release=${GITHUB_REF_NAME#v}
          version=${release%%-*}
          if [ "$version" != "$configured" ]; then
            echo "tag ${GITHUB_REF_NAME} would publish assets stamped ${configured:-<nothing>}; edit \"version\" in ${config} or retag" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches \"version\": \"${configured}\" in ${config}"

      # The same list `ci.yml` installs, arrived at by building rather than guessing. The last
      # four are the voice build's: `libasound2-dev` because cpal depends on `alsa-sys`
      # unconditionally here, `libclang-dev` because `whisper-rs-sys` and `pipewire-sys` both run
      # `bindgen` and the runner ships clang without the `.so`, and `meson`/`ninja-build` because
      # the echo canceller is vendored — no Debian or Ubuntu ships `webrtc-audio-processing` 2.x,
      # so there is no system copy to link against and a `.deb` could not name one.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libatk1.0-dev \
            librsvg2-dev \
            zlib1g-dev \
            libssl-dev \
            libayatana-appindicator3-1 \
            libpipewire-0.3-dev \
            libgbm-dev \
            libasound2-dev \
            libclang-dev \
            meson \
            ninja-build

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A release build shares nothing with the debug build `ci.yml` caches, hence its own key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # `tauri.conf.json` runs `pnpm --filter zyris-ui build` as its `beforeBuildCommand`, which
      # is what puts `ui/dist` in place for `tauri-build`; it is not committed. No code signing:
      # it needs certificates nobody has, and the bundler's warning about that is expected.
      # clang-sys looks in `lib` and the runner image puts the DLL in `bin`. Windows-only rather
      # than in the job `env`: an empty value on Linux points clang-sys at nothing.
      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Build the bundles
        shell: bash
        env:
          # `ort-sys` probes `pkg_config` for `libonnxruntime` before it considers downloading,
          # and a hit there links dynamically against a library the installer does not carry.
          # Forced off so the bundle links the statically-linked copy `ort` fetches — on both
          # runners, because `windows-latest` has Strawberry Perl's pure-Perl `pkg-config.bat`
          # on PATH and it answers.
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        run: pnpm tauri build --features ${{ matrix.features }}

      - name: Report what the bundler produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(${{ matrix.bundles }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing matched ${{ matrix.bundles }}; the bundle tree holds:" >&2
            find target/release/bundle -type f >&2 || true
            exit 1
          fi
          {
            echo "| bundle | bytes |"
            echo "| --- | --- |"
            for f in "${files[@]}"; do
              echo "| $(basename "$f") | $(wc -c <"$f") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    name: release
    needs: bundle
    # The tag is the only thing that publishes. A `workflow_dispatch` run never reaches this job,
    # so it cannot create a release — not even a draft one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Report what will be attached
        run: find bundles -type f -printf '%s\t%p\n'

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.deb
            bundles/**/*.exe
          fail_on_unmatched_files: true
          draft: false
          # A tag carrying a pre-release suffix — v0.0.1-pre-alpha.1 — is marked as one, and a
          # plain v1.2.3 is not. Written out rather than left to the action inferring it,
          # because "is this a pre-release" is the one thing a person downloading it reads
          # first and it should not depend on a default.
          prerelease: ${{ contains(github.ref_name, '-') }}
