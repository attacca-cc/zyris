name: Check

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Caches ~/.cargo/{registry,git} and target/, keyed on Cargo.lock + rustc version. Workspace
      # crates' own artifacts are pruned before saving, so the archive stays dependency-only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: cargo build
        run: cargo build --workspace

      # Includes zyris-macros' trybuild UI tests, which compare compiler diagnostics against
      # checked-in .stderr files — they are the reason a toolchain bump can fail this job on its own.
      #
      # **The feature flag is load-bearing, not a nicety.** `--workspace` builds every member with
      # its *default* features, and no member turns `zyris-capkit/transfer` on — so a plain
      # `cargo test --workspace` compiles all five of the file-transfer test files down to nothing
      # and reports `0 tests` for each. That was the state of this job until 2026-08-11: green over a
      # path jail, an undo trail and a TOFU pin that nothing had ever executed. Naming the feature
      # here is what makes those 44 tests real.
      - name: cargo test
        run: cargo test --workspace --features zyris-capkit/transfer-send
