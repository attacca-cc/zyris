[package]
name = "zyris"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zyris node runtime and client"

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["ws"], optional = true }
bytes.workspace = true
futures-util.workspace = true
gethostname = { version = "1.1.0", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"], optional = true }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
tracing.workspace = true
uuid.workspace = true
zyris-macros = { version = "0.1.0", path = "../zyris-macros" }
zyris-proto = { version = "0.1.0", path = "../zyris-proto" }

[features]
default = ["client", "hostname", "persistence", "runtime"]
client = ["dep:tokio-tungstenite"]
# Config, credential hooks, and the dial/reconnect loop — everything between "I have a capability"
# and "I am a running node". On by default because writing that loop per node is four chances to
# get backoff, credential rotation, or an exit code subtly wrong; the only cost is `tokio/signal`.
runtime = ["client", "tokio/signal"]
axum = ["dep:axum"]
testing = []
# Self-registration over the RFC 8628 device grant. Off by default so a node using a static `znt_`
# pays nothing for it. The marginal cost when it is on is smaller than it looks: `client` already
# pulls rustls and the native root store through `tokio-tungstenite`, so `reqwest` reuses that TLS
# stack and only adds the hyper/tower layer.
enroll = ["dep:reqwest"]
# Name the node after the machine it runs on. On by default because a node that names itself is the
# difference between zero configuration and one more variable to get wrong; `gethostname` is a thin
# wrapper over `gethostname(2)`/`GetComputerNameExW` and adds nothing transitive.
hostname = ["dep:gethostname"]
# The on-disk `CredentialStore` backend. Orthogonal to `enroll`: the trait and the in-memory backend
# are always compiled, so a node can keep its credentials in a keychain or a k8s Secret by turning
# this off and supplying its own.
persistence = []

[dev-dependencies]
tempfile.workspace = true
# Installs the commit hook into `.git/hooks` the first time `cargo test` runs
# (Rust counterpart of simple-git-hooks). Hook scripts live in `.cargo-husky/hooks/`;
# the `commit-msg` one enforces Conventional Commits. Set
# CARGO_HUSKY_DONT_INSTALL_HOOKS=true to skip installation.
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
