[package]
name = "zyris-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = { workspace = true }
fs4 = { workspace = true }
keyring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing = { workspace = true }
zyris = { workspace = true }

[dev-dependencies]
# `testing` gives `zyris::testing::duplex`, a pair of connected nodes with no socket in it.
# `announcement.rs`'s assertions are all about what the *peer* can see and call, and there is no
# way to ask that without a peer.
zyris = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
