[package]
name = "zyris-caps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in Zyris capabilities"

[dependencies]
bytes.workspace = true
futures-util.workspace = true
portable-pty = { version = "0.9.0", optional = true }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "sync", "macros", "rt"] }
zyris = { version = "0.1.0", path = "../zyris", default-features = false }

[features]
default = ["terminal-impl", "file-io-impl"]
terminal-impl = ["dep:portable-pty"]
file-io-impl = []

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
