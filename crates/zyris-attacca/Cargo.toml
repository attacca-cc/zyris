[package]
name = "zyris-attacca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The attacca_api capability: the surface the Attacca deployment announces to its nodes"

[dependencies]
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zyris = { version = "0.1.0", path = "../zyris", default-features = false }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zyris = { path = "../zyris", default-features = false, features = ["testing"] }
