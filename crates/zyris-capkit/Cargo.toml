[package]
name = "zyris-capkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementations of the standard Zyris capabilities"

[dependencies]
async-stream = { version = "0.3", optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
# A fork, for one addition: `Enigo::move_mouse_on_output`. Absolute motion under
# `wlr-virtual-pointer` is output-relative, so upstream's whole-desktop `move_mouse` can only ever
# land on the output its pointer was created against — see `EnigoInput::move_to`.
enigo = { version = "0.6.1", git = "https://github.com/mincomk/enigo", default-features = false, features = ["x11rb"], optional = true }
futures-util = { workspace = true, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# process-group kill (`kill(-pgid, SIGKILL)`) for `exec` timeouts on Unix.
libc = { version = "0.2", optional = true }
portable-pty = { version = "0.9.0", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "sync", "rt"], optional = true }
# 화면 모델. `vte`는 파서만 있고 화면이 없으며, `termwiz`·`alacritty_terminal`은 이 용도에 과하다.
vt100 = { version = "0.16.2", optional = true }
tracing.workspace = true
xcap = { version = "0.9.7", optional = true }
zyris = { version = "0.1.0", path = "../zyris", default-features = false }
zyris-caps = { version = "0.1.0", path = "../zyris-caps" }

# `xcap` enumerates monitors over XRandR even in a Wayland session, then captures in Wayland's
# coordinate space; the two disagree whenever Xwayland cannot express the compositor's layout. The
# Wayland backend goes straight to `wl_output`. This is the fork `xcap` itself depends on, so it
# costs no extra copy of the Wayland stack.
[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { package = "libwayshot-xcap", version = "0.3.3", optional = true }

[features]
default = ["file-io", "terminal"]
file-io = ["dep:tokio", "dep:bytes", "dep:futures-util"]
terminal = ["dep:portable-pty", "dep:tokio", "dep:bytes", "dep:futures-util", "dep:vt100", "dep:libc"]
screen = ["dep:xcap", "dep:image", "dep:tokio", "dep:libwayshot"]
input = ["dep:enigo", "dep:tokio"]
input-wayland = ["input", "enigo/wayland", "enigo/platform_specific"]
# libei(RemoteDesktop portal) 백엔드: GNOME/KDE Wayland에서 XTEST가 mutter에
# 무시되므로, 그 세션들의 유일하게 동작하는 입력 경로다. Windows/macOS 빌드에는
# 영향 없음 — reis/ashpd 의존성은 enigo 쪽에서 unix 전용으로 선언돼 있다.
input-libei = ["input", "enigo/libei", "enigo/smol", "enigo/platform_specific"]
desktop = ["screen", "input"]
# 노드 간 파일 전송의 받는 쪽. 파일시스템만 만지므로 그래픽 의존이 없고, P2P 전송로
# (`zyris-p2p`)와도 무관하다 — 이 feature만으로 `zyris::testing::duplex`에서 전 과정이 돈다.
transfer = [
    "dep:tokio",
    "dep:bytes",
    "dep:futures-util",
    "dep:sha2",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:async-stream",
    "dep:async-trait",
]

[dev-dependencies]
bytes.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
