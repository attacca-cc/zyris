[package]
name = "zyris-capkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementations of the standard Zyris capabilities"

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
# A fork, for one addition: `Enigo::move_mouse_on_output`. Absolute motion under
# `wlr-virtual-pointer` is output-relative, so upstream's whole-desktop `move_mouse` can only ever
# land on the output its pointer was created against — see `EnigoInput::move_to`.
enigo = { version = "0.6.1", git = "https://github.com/mincomk/enigo", default-features = false, features = ["x11rb"], optional = true }
futures-util = { workspace = true, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# process-group kill (`kill(-pgid, SIGKILL)`) for `exec` timeouts on Unix.
libc = { version = "0.2", optional = true }
portable-pty = { version = "0.9.0", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "sync", "rt"], optional = true }
# The screen model. `vte` is a parser with no screen behind it, and `termwiz` / `alacritty_terminal`
# are far more than this needs.
vt100 = { version = "0.16.2", optional = true }
tracing.workspace = true
xcap = { version = "0.9.7", optional = true }
zyris = { version = "0.1.0", path = "../zyris", default-features = false }
zyris-attacca = { version = "0.1.0", path = "../zyris-attacca", optional = true }
zyris-caps = { version = "0.1.0", path = "../zyris-caps" }
# The sending side dials peers and pins their keys. `iroh` is never named directly — `zyris-p2p`
# re-exports the one it resolved, so there is no way for a second copy to end up linked in.
zyris-p2p = { version = "0.1.0", path = "../zyris-p2p", optional = true }

# `xcap` enumerates monitors over XRandR even in a Wayland session, then captures in Wayland's
# coordinate space; the two disagree whenever Xwayland cannot express the compositor's layout. The
# Wayland backend goes straight to `wl_output`. This is the fork `xcap` itself depends on, so it
# costs no extra copy of the Wayland stack.
[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { package = "libwayshot-xcap", version = "0.3.3", optional = true }

[features]
default = ["file-io", "terminal"]
file-io = ["dep:tokio", "dep:bytes", "dep:futures-util"]
terminal = ["dep:portable-pty", "dep:tokio", "dep:bytes", "dep:futures-util", "dep:vt100", "dep:libc"]
screen = ["dep:xcap", "dep:image", "dep:tokio", "dep:libwayshot"]
input = ["dep:enigo", "dep:tokio"]
input-wayland = ["input", "enigo/wayland", "enigo/platform_specific"]
# The libei (RemoteDesktop portal) backend: mutter ignores XTEST on GNOME/KDE Wayland, so this is
# the only input path that works on those sessions. Windows and macOS builds are unaffected — the
# reis/ashpd dependencies are declared unix-only on the enigo side.
input-libei = ["input", "enigo/libei", "enigo/smol", "enigo/platform_specific"]
desktop = ["screen", "input"]
# The receiving side of node-to-node file transfer. It touches nothing but the filesystem, so it
# pulls in no graphics dependencies, and it is independent of the P2P transport (`zyris-p2p`) — this
# feature alone is enough to drive the whole exchange over `zyris::testing::duplex`.
transfer = [
    "dep:tokio",
    "dep:bytes",
    "dep:futures-util",
    "dep:sha2",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:async-trait",
    "dep:libc",
]
# The sending side: `file_transfer.send_to`. Split out from `transfer` rather than folded into it
# because this is where the dependency weight is — the rendezvous client and the whole iroh QUIC
# stack — and a node that only ever *receives* should not have to build any of it.
transfer-send = ["transfer", "dep:zyris-attacca", "dep:zyris-p2p"]

[dev-dependencies]
bytes.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `zyris::testing::duplex` — two real Connections over a channel. Every transfer test drives the
# whole exchange through it, so none of them needs a socket. It is a non-default feature, and
# without this line the transfer tests do not compile at all.
zyris = { version = "0.1.0", path = "../zyris", default-features = false, features = ["testing"] }
