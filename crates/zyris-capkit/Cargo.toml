[package]
name = "zyris-capkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementations of the standard Zyris capabilities"

[dependencies]
bytes = { workspace = true, optional = true }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"], optional = true }
futures-util = { workspace = true, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
portable-pty = { version = "0.9.0", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "sync", "rt"], optional = true }
tracing.workspace = true
xcap = { version = "0.9.7", optional = true }
zyris = { version = "0.1.0", path = "../zyris", default-features = false }
zyris-caps = { version = "0.1.0", path = "../zyris-caps" }

[features]
default = ["file-io", "terminal"]
file-io = ["dep:tokio", "dep:bytes", "dep:futures-util"]
terminal = ["dep:portable-pty", "dep:tokio", "dep:bytes", "dep:futures-util"]
screen = ["dep:xcap", "dep:image", "dep:tokio"]
input = ["dep:enigo", "dep:tokio"]
input-wayland = ["input", "enigo/wayland"]
desktop = ["screen", "input"]

[dev-dependencies]
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
