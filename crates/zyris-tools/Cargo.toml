[package]
name = "zyris-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# `rt` alone: the only thing this crate asks of tokio is `spawn`, for the peer accept loop. The
# runtime itself is `main`'s to build.
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
zyris = { workspace = true }
zyris-attacca = { workspace = true }
zyris-fs = { workspace = true }
# `wayland`: on a wlroots compositor (Hyprland, Sway) enigo drives `wlr-virtual-pointer` before X11.
# Without it the only Linux backend is XTEST, which in a Wayland session reaches Xwayland's pointer
# and not the one on screen — every call succeeds and nothing moves. enigo declares the feature's
# dependencies for non-macOS unix only, so Windows and macOS builds do not change.
zyris-input = { workspace = true, features = ["wayland"] }
# For one constant: the prefix every promoted MCP capability is named with. `guarded.rs`'s audit
# exemption keys on it, so the two must be the same string — and two copies of a string that must
# agree is exactly the shape that fails quietly.
zyris-mcp = { path = "../zyris-mcp" }
zyris-runtime = { path = "../zyris-runtime" }
zyris-screen = { workspace = true }
zyris-terminal = { workspace = true }
zyris-transfer = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `rt-multi-thread` on top of the two the other tests need: binding an iroh endpoint starts
# background tasks that keep running while the test awaits something else, and a current-thread
# runtime only drives them at an await point of its own.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# Every assertion in `servers_come_and_go.rs` is about what a *peer* can see and call, and
# `zyris::testing::duplex` is the only way to have one without a socket.
zyris = { workspace = true, features = ["testing"] }

# `zyris-mcp`'s probe server, built here too rather than copied. A second hand-written MCP server
# would be a second thing to keep in step with the protocol, and the whole value of the probe is
# that it is not written by the code under test. A cross-package `path` is legal; the name differs
# from `zyris-mcp`'s so the two packages do not write the same file in `target/<profile>/examples`.
[[example]]
name = "mcp_probe_server"
path = "../zyris-mcp/tests/support/probe_server.rs"
