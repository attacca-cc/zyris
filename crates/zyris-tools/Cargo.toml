[package]
name = "zyris-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
zyris = { workspace = true }
zyris-fs = { workspace = true }
zyris-input = { workspace = true }
zyris-runtime = { path = "../zyris-runtime" }
zyris-screen = { workspace = true }
zyris-terminal = { workspace = true }
zyris-transfer = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `rt-multi-thread` on top of the two the other tests need: binding an iroh endpoint starts
# background tasks that keep running while the test awaits something else, and a current-thread
# runtime only drives them at an await point of its own.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
