[package]
name = "zyris-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zyris"
path = "src/main.rs"

[dependencies]
zyris-autostart = { path = "../zyris-autostart" }
# The local MCP servers: which ones this instance has configured, and starting them. Here rather
# than in `zyris-tools` because starting one is asynchronous and can fail, and a capability list
# is neither.
zyris-mcp = { path = "../zyris-mcp" }
zyris-runtime = { path = "../zyris-runtime" }
zyris-tools = { path = "../zyris-tools" }
anyhow = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# `time` and `sync` are `confirm.rs`: a question waits on a `oneshot` and answers itself when the
# deadline fires. `signal` is headless's shutdown, `rt-multi-thread` the runtime `main` builds.
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The wire shape of what the Settings screen reads, pinned by a test in `bridge.rs`.
serde_json = { workspace = true }
# A directory per peer identity, for the tests in `confirm.rs` and `main.rs` that bind a real
# `Peering` and read the ledger an approval writes. Nothing in this crate writes to disk outside
# a test.
tempfile = { workspace = true }
# `macros` for `#[tokio::test]`, which `confirm.rs` needs: every assertion there is about what a
# waiting `async fn` does, and `test-util` is what lets the deadline test move the clock instead of
# sitting out the real 45 seconds.
tokio = { workspace = true, features = ["macros", "test-util"] }

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Tauri decides dev-vs-production from this feature alone, not from the cargo profile:
# `tauri::is_dev()` is `!cfg!(feature = "custom-protocol")`. Without it, even a release build
# loads the frontend from `devUrl` and shows a connection error when no dev server is running.
# `tauri build` enables it for you; a plain `cargo build --release` does not.
custom-protocol = ["tauri/custom-protocol"]
