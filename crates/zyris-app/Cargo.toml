[package]
name = "zyris-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zyris"
path = "src/main.rs"

# The phone app (`src/mobile.rs`), which Tauri's Android and iOS builds load as a library. Empty
# on a desktop build: the desktop app is the binary above.
[lib]
name = "zyris_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
zyris-runtime = { path = "../zyris-runtime" }
# Speech. **Present on every build, and the feature below is the only thing that changes.**
# With `voice` off this crate still exports `VoiceEvent` and a stream that has already ended,
# so nothing in `zyris-app` has to ask which build it is in — see `zyris_voice`'s module
# documentation, and the test that fails if a `#[cfg(feature = ..)]` ever appears here.
zyris-voice = { path = "../zyris-voice" }
anyhow = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
# Also what `generate_context!` writes plugin configuration (the updater's) into.
serde_json = { workspace = true }
tauri = { workspace = true }
# `time` and `sync` are `confirm.rs`: a question waits on a `oneshot` and answers itself when the
# deadline fires. `signal` is headless's shutdown, `rt-multi-thread` the runtime `main` builds.
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Everything that acts on the computer the app runs on, or needs a desktop session: the tools and
# MCP servers a node announces, autostart, the push-to-talk key, one window per machine, the CLI.
# None of it builds for a phone or would mean anything there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
zyris-autostart = { path = "../zyris-autostart" }
# The local MCP servers: which ones this instance has configured, and starting them. Here rather
# than in `zyris-tools` because starting one is asynchronous and can fail, and a capability list
# is neither.
zyris-mcp = { path = "../zyris-mcp" }
zyris-tools = { path = "../zyris-tools" }
clap = { workspace = true }
# The push-to-talk key on X11 and on Windows. The crate carries a no-op backend for the ones it
# does not implement, and `hotkey::start` never reaches it on a Wayland session anyway.
global-hotkey = { workspace = true }
open = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# Updates from the GitHub releases, signature-checked; see `update.rs`.
tauri-plugin-updater = "2"

# The phone app: a conversation with no audio yet (`zyris-voice`'s `conversation`), and the
# browser for the enrolment link.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
zyris-voice = { path = "../zyris-voice", features = ["conversation"] }
tauri-plugin-opener = "2"
# The Kotlin half: screen, touch, the foreground service and the installer (Android only; on iOS
# it registers nothing).
tauri-plugin-zyris-mobile = { path = "../zyris-mobile" }

# Android verifies TLS through the platform, over JNI, and the verifier has to be handed the JVM
# and the app's Context before the first request — see `mobile.rs`. Same versions as the lockfile.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# Where cpal looks for the JVM; set from `initTls` in `mobile.rs`.
ndk-context = "0.1"
rustls-platform-verifier = "0.7"
# What the phone serves its agent (`phone.rs`): the capability traits, the file backend the
# desktop uses too, and the APK download for updates.
zyris = { workspace = true }
zyris-fs = { workspace = true }
base64 = "0.22"
reqwest = { workspace = true }
rustls = { workspace = true }

# iOS has no certificate files for the websocket's `rustls-native-certs` to read, so Mozilla's roots
# are written to one at start and pointed at with `SSL_CERT_FILE` — see `mobile.rs`.
[target.'cfg(target_os = "ios")'.dependencies]
base64 = "0.22"
webpki-root-certs = "1"

# The Wayland half of the push-to-talk key. Linux only, because the GlobalShortcuts portal is:
# `ashpd` speaks D-Bus to `xdg-desktop-portal`, which exists nowhere else. Windows takes the
# `global-hotkey` path above and never reaches this.
[target.'cfg(target_os = "linux")'.dependencies]
# The version Tauri itself builds on, for styling the title bar GTK draws.
gtk = "0.18"
ashpd = { workspace = true }
futures-util = { workspace = true }

# One `#[ignore]`d test in `hotkey/x11.rs`, and only that. It measures how many `WM_HOTKEY` a
# held key produces, which needs a message pump — a `#[test]` has no event loop, and without one
# `global-hotkey`'s message-only window is never dispatched to. Nothing outside a test uses it.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The wire shape of what the Settings screen reads, pinned by a test in `bridge.rs`.
serde_json = { workspace = true }
# A directory per peer identity, for the tests in `confirm.rs` and `main.rs` that bind a real
# `Peering` and read the ledger an approval writes. Nothing in this crate writes to disk outside
# a test.
tempfile = { workspace = true }
# `macros` for `#[tokio::test]`, which `confirm.rs` needs: every assertion there is about what a
# waiting `async fn` does, and `test-util` is what lets the deadline test move the clock instead of
# sitting out the real 45 seconds.
tokio = { workspace = true, features = ["macros", "test-util"] }

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Tauri decides dev-vs-production from this feature alone, not from the cargo profile:
# `tauri::is_dev()` is `!cfg!(feature = "custom-protocol")`. Without it, even a release build
# loads the frontend from `devUrl` and shows a connection error when no dev server is running.
# `tauri build` enables it for you; a plain `cargo build --release` does not.
custom-protocol = ["tauri/custom-protocol"]

# The audio stack, off by default. **It forwards and does nothing else.** There is deliberately
# no `#[cfg(feature = "voice")]` anywhere in this crate: the on build and the off build run the
# same lines, so the on build cannot quietly stop compiling while everybody develops against
# the off one. `tests/the_app_never_asks_whether_voice_is_compiled_in.rs` is what holds that.
voice = ["zyris-voice/voice"]

# Echo cancellation on top, vendored rather than linked. Forwards and does nothing else, like
# `voice`. **Linux only** — see `zyris-voice`'s `aec-bundled` for why, and note Windows gets a
# canceller regardless, from the DSP that ships with the operating system.
aec = ["voice", "zyris-voice/aec-bundled"]

# Transcription and synthesis on the GPU, or either half alone. Forward; see `zyris-voice`.
gpu = ["voice", "zyris-voice/gpu"]
gpu-stt = ["voice", "zyris-voice/gpu-stt"]
# Whisper on a phone's NPU through LiteRT (zyris-voice/src/npu.rs). Android builds only: the
# phone APK carries LiteRT and the Qualcomm libraries (scripts/android/npu-libs.sh).
npu = ["voice", "zyris-voice/npu"]
gpu-tts = ["voice", "zyris-voice/gpu-tts"]
metal = ["voice", "zyris-voice/metal"]
