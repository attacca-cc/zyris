[package]
name = "zyris-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not a compilation step: `build.rs` is the only thing that can refuse a release built with
# `GGML_NATIVE` on, and it explains why in its own module documentation.
build = "build.rs"

[dependencies]
# The stream, and nothing heavier. `sync` builds no runtime: it is the same `broadcast` the
# event bus and the hotkey already hand out, so a consumer of this crate learns no third shape.
tokio = { workspace = true, features = ["sync"] }
# `VoiceEvent` crosses the IPC bridge to the window, exactly as `CoreEvent` does.
serde = { workspace = true }

# **Every one of these is `optional`, and that is the whole design.** `members = ["crates/*"]`
# means this crate is compiled by `cargo test --workspace` whichever way the feature goes, so
# "off" can only mean "these are not pulled in". A cold build of them is 2m 06s at 253% CPU with
# a 714 MB peak, against 1.4 s for a warm `cargo build --release` — measured on this machine,
# 2026-09-15, and the reason the flag exists.
#
# They are declared before any code calls them: tasks 3 to 6 of step 7 fill that in. Cargo
# compiles an enabled optional dependency whether or not a line of Rust names it, which is what
# makes the CI job in `.github/workflows/ci.yml` worth having now rather than in four tasks'
# time — the thing that breaks on a runner is the *native* build, not our use of it.
[dependencies.cpal]
workspace = true
optional = true

[dependencies.rubato]
workspace = true
optional = true

[dependencies.earshot]
workspace = true
optional = true

[dependencies.whisper-rs]
workspace = true
optional = true

[dependencies.webrtc-audio-processing]
workspace = true
optional = true

# Where the 141 MB model goes: the platform cache directory, shared by every instance. See
# `stt::cache_dir` for why it is the cache and not `zyris-app`'s per-instance data directory.
[dependencies.directories]
workspace = true
optional = true

# How it gets there. Already in every build of `zyris-app` through `iroh`; here it is behind
# the feature, so the off build still has no HTTP client of its own.
[dependencies.reqwest]
workspace = true
optional = true

# Only to install `ring` as the process TLS provider; `reqwest` is taken with
# `rustls-no-provider` so that this workspace does not grow an `aws-lc-rs` native build.
[dependencies.rustls]
workspace = true
optional = true

# The digest that says the bytes are the model and not a proxy's error page.
[dependencies.sha2]
workspace = true
optional = true

[dev-dependencies]
# `#[tokio::test]`, for the half of the stream test that awaits rather than polls. **No
# dev-dependency here may enable `voice`**: feature unification would put the whole native
# stack into `cargo test --workspace`, which is the one thing the flag exists to prevent.
# `tests/nothing_turns_the_feature_on_by_itself.rs` fails if one ever does.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# The wire shape `VoiceEvent` takes to the window, pinned by a test rather than discovered in
# TypeScript.
serde_json = { workspace = true }

[features]
default = []

# Hearing: a microphone, the rate conversion whisper needs, the detector that says when somebody
# stopped talking, and whisper itself. `zyris-app`'s own `voice` feature forwards to exactly
# this and to nothing else.
#
# **This is what CI compiles, on both runners.** Everything in it is either pure Rust or builds
# from source with a toolchain `ubuntu-latest` and `windows-latest` already have.
# `tokio/rt` is in here rather than in the base dependency for the same reason everything else
# is: `spawn_blocking` is what keeps `state.full()` off the runtime, and a build with no whisper
# has nothing to send there.
voice = [
    "dep:cpal",
    "dep:rubato",
    "dep:earshot",
    "dep:whisper-rs",
    "dep:directories",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "tokio/rt",
]

# Echo cancellation, so the microphone can stay open while Zyris is speaking.
#
# **Separate from `voice`, and not implied by it, because nothing that ships can build it
# today.** Established 2026-09-15, by reading rather than by hoping:
#
# - `webrtc-audio-processing` 2.1 wants pkg-config `webrtc-audio-processing-2` >= 2.1. **No
#   Debian or Ubuntu ships 2.x at all** — noble, which *is* `ubuntu-latest`, has 0.3.1; plucky,
#   questing and Debian stable/testing/unstable have 1.3. So the runner cannot install it and
#   the `.deb` cannot name it in `Depends:`.
# - The `bundled` feature shells out to **`meson`, which is on neither runner** (and is not on
#   this development machine either, which has no Python at all — so `bundled` stays unverified
#   on every platform this project can reach).
# - On Windows there is no supported build in any case: upstream issue #34 has been open since
#   2023-09-27, the only CI matrix is `[ubuntu-latest, macos-latest]`, and PR #102 adding MSVC
#   support is unmerged and unverified at runtime by its own author.
#
# It builds on *this* NixOS machine, which has 2.1 through `pkg-config`, and that is how task 4
# will be developed. `cargo build -p zyris-voice --features aec` is the one-line reproduction of
# everything above.
#
# Implies `voice`: cancelling the echo out of a microphone nobody opened is not a thing.
aec = ["voice", "dep:webrtc-audio-processing"]
