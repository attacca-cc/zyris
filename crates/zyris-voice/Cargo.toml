[package]
name = "zyris-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not a compilation step: `build.rs` is the only thing that can refuse a release built with
# `GGML_NATIVE` on, and it explains why in its own module documentation.
build = "build.rs"

[dependencies]
# The stream, and nothing heavier. `sync` builds no runtime: it is the same `broadcast` the
# event bus and the hotkey already hand out, so a consumer of this crate learns no third shape.
tokio = { workspace = true, features = ["sync"] }
# `VoiceEvent` crosses the IPC bridge to the window, exactly as `CoreEvent` does.
serde = { workspace = true }

# **Every one of these is `optional`, and that is the whole design.** `members = ["crates/*"]`
# means this crate is compiled by `cargo test --workspace` whichever way the feature goes, so
# "off" can only mean "these are not pulled in". A cold build of them is 2m 06s at 253% CPU with
# a 714 MB peak, against 1.4 s for a warm `cargo build --release` â measured on this machine,
# 2026-09-15, and the reason the flag exists.
#
# They are declared before any code calls them: tasks 3 to 6 of step 7 fill that in. Cargo
# compiles an enabled optional dependency whether or not a line of Rust names it, which is what
# makes the CI job in `.github/workflows/ci.yml` worth having now rather than in four tasks'
# time â the thing that breaks on a runner is the *native* build, not our use of it.
[dependencies.cpal]
workspace = true
optional = true

[dependencies.rubato]
workspace = true
optional = true

[dependencies.earshot]
workspace = true
optional = true

# The wake word's feature front end. See the root manifest: this is already compiled.
[dependencies.realfft]
workspace = true
optional = true

[dependencies.whisper-rs]
workspace = true
optional = true

# Speech out: Supertonic 3 through ONNX Runtime. The feature choice and what it costs are argued
# in the root manifest, where the version is declared.
[dependencies.ort]
workspace = true
optional = true

# NFKD, without which Korean is silent and French is mangled. See `tts.rs`.
[dependencies.unicode-normalization]
workspace = true
optional = true

[dependencies.webrtc-audio-processing]
workspace = true
optional = true

# Where the 141 MB model goes: the platform cache directory, shared by every instance. See
# `stt::cache_dir` for why it is the cache and not `zyris-app`'s per-instance data directory.
[dependencies.directories]
workspace = true
optional = true

# How it gets there. Already in every build of `zyris-app` through `iroh`; here it is behind
# the feature, so the off build still has no HTTP client of its own.
[dependencies.reqwest]
workspace = true
optional = true

# Only to install `ring` as the process TLS provider; `reqwest` is taken with
# `rustls-no-provider` so that this workspace does not grow an `aws-lc-rs` native build.
[dependencies.rustls]
workspace = true
optional = true

# The wake word manifest. Already in this graph through `reqwest`; naming it here is what
# makes it usable, and it is behind the feature like everything else heavy.
[dependencies.serde_json]
workspace = true
optional = true

# The digest that says the bytes are the model and not a proxy's error page.
[dependencies.sha2]
workspace = true
optional = true

# One thing only: saying so when the stored voice settings cannot be read. That failure leaves
# the microphone shut, which is the safe answer and also the silent one, so there has to be a
# line somewhere. Behind the feature like everything else — the off build keeps its two
# dependencies and nothing else.
[dependencies.tracing]
workspace = true
optional = true

# The turn feed: `turn_events`, `send_message`, and the frames they carry. `speak::Kind` still
# mirrors `ZDeltaKind` rather than re-exporting it, and `turn.rs` is the one place the two are
# mapped -- one line that stops compiling if the protocol grows an arm.
#
# **Not optional, from task 4 of step 8, and it is the first thing in step 8 that costs the off
# build anything.** `zyris-app` may contain no `#[cfg(feature = "voice")]`, so the connect hook
# it installs cannot name `turn::Feed`, which exists only with the feature. The seam is therefore
# a method on `Voice` -- `Voice::on_connect` -- and it has to have one signature in both builds,
# which means naming `zyris::Connection` in both. There is no cheaper shape: a generic parameter
# would need a bound, and a bound is the same dependency.
#
# What the off build now pulls in is **nothing the workspace was not already building**:
# `zyris-runtime`, `zyris-tools` and `zyris-app` all depend on `zyris` unconditionally, so
# `cargo test --workspace` compiles the same set either way. What changes is a crate outside this
# workspace taking `zyris-voice` with default features: it used to get `tokio/sync` and `serde`,
# and now gets the protocol stack with them.
[dependencies.zyris]
workspace = true

[dependencies.zyris-attacca]
workspace = true
optional = true

# Reading a `Streaming`'s items: `StreamExt::next`, and nothing else. Already in this workspace
# through `zyris-app`.
[dependencies.futures-util]
workspace = true
optional = true


# The Windows echo canceller. **Target-gated as well as optional**: a Linux build of `voice`
# enables this feature and cargo still builds nothing, because the dependency is declared for
# `cfg(windows)` only. That is what lets `win_aec.rs` sit behind plain `voice` rather than
# behind `aec` — see the feature list below for why those are not the same thing.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
optional = true

# The same copy again under the name `#[implement]` writes into the code it generates.
[target.'cfg(windows)'.dependencies.windows-core]
workspace = true
optional = true

[dev-dependencies]
# `#[tokio::test]`, for the half of the stream test that awaits rather than polls. **No
# dev-dependency here may enable `voice`**: feature unification would put the whole native
# stack into `cargo test --workspace`, which is the one thing the flag exists to prevent.
# `tests/nothing_turns_the_feature_on_by_itself.rs` fails if one ever does.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# The wire shape `VoiceEvent` takes to the window, pinned by a test rather than discovered in
# TypeScript.
serde_json = { workspace = true }
# **The only way to assert that a log line exists.** `session.rs` used to discard every device
# problem it could carry on through, which left "the microphone went quiet and stayed quiet" —
# the one failure this crate cannot otherwise explain — with no evidence anywhere. A test that
# reads the code rather than the output would pass for a `tracing::debug!` nobody can reach.
tracing-subscriber = { workspace = true }

[features]
default = []

# Hearing: a microphone, the rate conversion whisper needs, the detector that says when somebody
# stopped talking, and whisper itself. `zyris-app`'s own `voice` feature forwards to exactly
# this and to nothing else.
#
# **This is what CI compiles, on both runners.** Everything in it is either pure Rust or builds
# from source with a toolchain `ubuntu-latest` and `windows-latest` already have.
# `tokio/rt` is in here rather than in the base dependency for the same reason everything else
# is: `spawn_blocking` is what keeps `state.full()` off the runtime, and a build with no whisper
# has nothing to send there.
voice = [
    "dep:cpal",
    "dep:rubato",
    "dep:earshot",
    "dep:realfft",
    "dep:whisper-rs",
    "dep:ort",
    "dep:unicode-normalization",
    "dep:directories",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:serde_json",
    "dep:tracing",
    "dep:zyris-attacca",
    "dep:futures-util",
    # Windows only, and built by nothing anywhere else: see the target section above.
    "dep:windows",
    "dep:windows-core",
    "tokio/rt",
]

# Echo cancellation, so the microphone can stay open while Zyris is speaking.
#
# **Separate from `voice`, and not implied by it, because nothing that ships can build it
# today.** Established 2026-09-15, by reading rather than by hoping:
#
# - `webrtc-audio-processing` 2.1 wants pkg-config `webrtc-audio-processing-2` >= 2.1. **No
#   Debian or Ubuntu ships 2.x at all** â noble, which *is* `ubuntu-latest`, has 0.3.1; plucky,
#   questing and Debian stable/testing/unstable have 1.3. So the runner cannot install it and
#   the `.deb` cannot name it in `Depends:`.
# - The `bundled` feature shells out to **`meson`, which is on neither runner** (and is not on
#   this development machine either, which has no Python at all â so `bundled` stays unverified
#   on every platform this project can reach).
# - On Windows there is no supported build in any case: upstream issue #34 has been open since
#   2023-09-27, the only CI matrix is `[ubuntu-latest, macos-latest]`, and PR #102 adding MSVC
#   support is unmerged and unverified at runtime by its own author.
#
# It builds on *this* NixOS machine, which has 2.1 through `pkg-config`, and that is how task 4
# will be developed. `cargo build -p zyris-voice --features aec` is the one-line reproduction of
# everything above.
#
# Implies `voice`: cancelling the echo out of a microphone nobody opened is not a thing.
aec = ["voice", "dep:webrtc-audio-processing"]

# The same canceller, built from source rather than linked against a system copy — and this is
# the one a release uses, because there is no system copy to link against: **no Debian or Ubuntu
# ships `webrtc-audio-processing` 2.x**, so a `.deb` naming it in `Depends:` would name a
# package that does not exist.
#
# Measured on 2026-09-19 rather than assumed, because this repository said for four sections that
# it had never been built anywhere: it builds in **6m 02s** on a 3.6 GB machine, links
# **statically** (no `libwebrtc` in `ldd`, so the `.deb` gains no dependency at all), and passes
# the suite including the test that measures cancellation rather than compilation. All it wanted
# was `meson` and `ninja`, one apt line away on the runner.
#
# Linux only. Upstream has no supported Windows build — issue #34 open since 2023-09-27, the MSVC
# pull request unmerged, and its author saying he has never verified the processing behaves
# correctly at run time — so Windows uses `win_aec.rs`, the DSP that ships with the OS.
aec-bundled = ["aec", "webrtc-audio-processing/bundled"]
