[workspace]
resolver = "3"
members = [
    "crates/zyris",
    "crates/zyris-attacca",
    "crates/zyris-capkit",
    "crates/zyris-caps",
    "crates/zyris-hello",
    "crates/zyris-macros",
    "crates/zyris-p2p",
    "crates/zyris-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/attacca-cc/zyris"

[workspace.dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
futures-util = "0.3.32"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

# Debug builds carried full debug info, and on a machine with a small disk that is what fills it:
# this workspace's `target/` reached 33 GiB and a build died with "No space left on device" mid-run.
# `line-tables-only` keeps what a panic needs — file and line in every backtrace frame — and drops
# the variable and type information only a debugger reads. Set it back to `true` for a session with
# gdb or lldb; nothing else here wants it.
[profile.dev]
debug = "line-tables-only"
