[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is the first toolchain that understands edition 2024, which this workspace requires.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/attacca-cc/zyris"

[workspace.dependencies]
anyhow = "1.0.104"
# The GlobalShortcuts portal, and the only way to register a global key on Wayland. Linux only,
# and `default-features = false` because the defaults pull in every portal interface this project
# will never ask for. `tokio` selects zbus's tokio executor, which is the runtime `main` builds.
ashpd = { version = "0.13.13", default-features = false, features = [
    "global_shortcuts",
    "tokio",
] }
clap = { version = "4.6.6", features = ["derive"] }
# Audio in. `pipewire` is on for a reason worth writing down: the default ALSA backend on this
# machine enumerates **7 input devices for one microphone**, and one of them is `null`, whose
# description is "generate zero samples (capture)" and which reports `supports_input() == true`
# with a perfectly ordinary `default_input_config()` — a person who picks it gets silence
# forever and no error. PipeWire lists 5 with readable names and exposes `default_sink` as
# `Duplex`, which is the render reference step 8's echo cancellation needs. It costs +1m32s of
# build and `libpipewire-0.3-dev`, which CI already installs. Windows is unaffected: cpal
# declares `pipewire` only under a Linux/BSD `[target]`, so the feature is inert there.
cpal = { version = "0.18.2", features = ["pipewire"] }
directories = "6.0.0"
# Voice activity detection: a 2026 neural detector with no external dependency and no model file
# (40 KB embedded). 23.25 us per 256-sample frame — 0.145% of one core, and 10.2x faster than
# Silero through ONNX measured side by side, which is what took ONNX Runtime out of this project
# altogether. `webrtc-audio-processing` 2.x has no VAD of its own; the old APM's
# `voice_detection` is gone from its `Config`.
earshot = "1.2.2"
fs4 = "1.1.0"
# `StreamExt::next` over the two portal signal streams `ashpd` hands out. Already in the tree
# through `zbus`; named here so the one crate that calls it does not depend on that staying true.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The X11 and Windows hotkey, taken directly rather than through `tauri-plugin-global-shortcut`.
# That plugin is a re-export of this crate plus four IPC commands; `hotkey/mod.rs` says why the
# plugin is the wrong shape here, and why registering it alongside this would be a mistake.
global-hotkey = "0.8.0"
keyring = "4.2.0"
open = "5.4.4"
# ONNX Runtime, for Supertonic 3 — the one thing in this workspace that is not pure Rust or a
# vendored C source tree. **`=2.0.0-rc.10`, and the default features are taken on purpose.**
#
# The features are a choice between two costs and only one of them can be paid on Windows, where
# the `.exe` ships alone:
#
# - `download-binaries` fetches a prebuilt ONNX Runtime **at build time** — one `.tgz` per target
#   from `cdn.pyke.io`, pinned by URL and checked against a SHA-256 in `ort-sys`'s own
#   `dist.txt`, cached per machine — and **links it statically**. Nothing has to ship beside the
#   binary and nothing has to be set at runtime.
# - `load-dynamic` fetches nothing and needs `ORT_DYLIB_PATH` pointing at an `onnxruntime` shared
#   library **on the user's machine, at run time**. Nothing sets that for somebody who
#   double-clicked an installer, and the `.deb` cannot name a package either: ONNX Runtime is not
#   in Ubuntu 22.04 or 24.04 at all.
#
# So the download is taken, and **this reverses a decision this project made once**: `earshot` was
# chosen over Silero partly to keep a build-time binary fetch out of the tree. That argument was
# about a component with a dependency-free alternative; Supertonic is ONNX or it is nothing, so the
# cost here can only be moved, not avoided — and moving it to the user is worse than paying it in
# CI. `ORT_LIB_LOCATION` and `ORT_SKIP_DOWNLOAD` are the escape hatch for a distribution that
# wants to link its own copy. It is behind `zyris-voice`'s `voice` feature, so a default build
# still fetches nothing.
#
# `copy-dylibs` is kept although the CPU distribution is static: it is a no-op when there is no
# dylib, and it is what would carry one if a target's distribution ever ships one.
#
# **`ort-sys` tries `pkg_config` for `libonnxruntime` *before* it considers downloading anything**
# (measured 2026-09-15, not read off the feature list). On this NixOS machine that succeeds —
# `libonnxruntime` 1.24.4 is in the global environment — so a local build quietly links
# *dynamically* against a `/nix/store` path and fetches nothing at all. That is a different build
# from the one that ships, and CI now sets `LIBONNXRUNTIME_NO_PKG_CONFIG=1` on **both** runners so
# that it is not: the Windows runner has Strawberry Perl's fake `pkg-config.bat` on PATH, which is
# exactly the trap this repository already documents for `-sys` crates, and it now has a crate in
# the `voice` build that walks into it.
#
# `=2.0.0-rc.10` rather than the newer rc.13: rc.10 is the version every timing in
# `zyris-voice`'s `tts` module was measured against, and a release candidate is not a place to
# take a free upgrade.
ort = "=2.0.0-rc.10"
# `default-features = false` on purpose. `rmcp`'s defaults are `base64`, `macros` and `server`,
# and this workspace is only ever an MCP *client*: it spawns somebody else's server and asks what
# it has. Taking the defaults would compile the server half, its `schemars` schema generation and
# a proc-macro crate, for code nothing here calls.
#
# A plain caret, unlike the six protocol crates below: `rmcp` is not part of that pinned rev and
# has no path dependency anyone can reach around the registry with.
rmcp = { version = "3.3.0", default-features = false, features = [
    "client",
    "transport-child-process",
] }
# The one HTTP client in this workspace, and it is already here: `iroh` pulls it in for every
# build. `zyris-voice` uses it for one thing, the 141 MB speech model, and it is behind the
# `voice` feature so the off build still has no downloader.
#
# **`rustls-no-provider` and not `rustls`, deliberately.** `rustls` would select
# `aws-lc-rs`, which is a cmake-and-NASM native build that nothing in this workspace has today;
# `rustls-no-provider` takes the `ring` that `iroh` already compiles and leaves the choice of
# provider to us — `stt::fetch` installs it. Both spellings pull in `rustls-platform-verifier`,
# so certificates are checked against the machine's own store rather than a copy of Mozilla's
# baked into the binary, and a proxy a user has already trusted keeps working.
# `system-proxy` costs three lockfile entries (`system-configuration`, `windows-registry`, and a
# second major of `core-foundation` that only macOS would build) and buys the case it is here
# for: a corporate Windows machine whose proxy is set in Windows settings and in no environment
# variable. Downloading 141 MB is the one thing this program asks of the network besides its own
# websocket, and failing it on such a machine would look like a broken build.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "system-proxy",
] }
# Capture comes in at whatever the device offers and whisper wants 16 kHz mono. Linux accepts a
# 16 kHz mono request directly through ALSA's plug layer or PipeWire; **Windows does not** —
# `cpal`'s WASAPI backend puts `AUDCLNT_STREAMFLAGS_AUTOCONVERTPCM` on output streams only, and
# says so in its own comment. So the conversion is ours on every platform, and a test that runs
# only on Linux would never see the bug. 48k -> 16k costs 26 us per 1024-frame block.
rubato = "5.0.0"
# Only for `CryptoProvider::install_default`: see `reqwest` above. `ring` is the provider
# `iroh` already builds, so this adds no native code to any platform.
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The model's integrity check. 0.10 rather than 0.11 because 0.10 is the copy already in the
# lockfile through the protocol stack; taking 0.11 would compile a second one for one digest.
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-single-instance = "2.4.4"
tempfile = "3.24.0"
time = { version = "0.3.44", features = ["formatting"] }
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# NFKD. **Not a convenience and not only about Korean**: every precomposed Hangul syllable and
# every precomposed accented Latin letter is absent from Supertonic's codepoint table, while the
# jamo and the base-plus-combining-mark pairs they decompose to are in it. Hangul decomposition is
# arithmetic and could have been written here; `é` could not. Measured 2026-09-15; see
# `zyris-voice`'s `tts` module.
unicode-normalization = "0.1.24"
# Echo cancellation. Behind `zyris-voice`'s `aec` feature rather than its `voice` one, because
# no runner and no Debian release can supply it — that manifest carries the evidence.
webrtc-audio-processing = "2.1.0"
# Speech to text, building a vendored whisper.cpp through CMake. **`GGML_NATIVE` defaults to ON
# and would ship a binary that SIGILLs on somebody else's CPU**; `whisper-rs-sys/build.rs`
# forwards any `WHISPER_`/`GGML_`/`CMAKE_` environment variable to CMake, so `GGML_NATIVE=OFF`
# is the whole fix, and it is set in CI. AVX2 is still required. No GPU feature is on: the
# defaults are empty and every accelerator here is opt-in.
# `tracing_backend` rather than the default, which is no backend at all: whisper.cpp prints a
# screenful of model parameters and timings to stderr on every load, and in `--headless` that is
# the process log. `zyris_voice::stt::Stt::load` installs the hooks once per process.
whisper-rs = { version = "0.16.0", features = ["tracing_backend"] }
# The Windows echo canceller, which is the operating system's own: the Voice Capture DSP,
# `CWMAudioAEC`. **Only `zyris-voice` names this, only on Windows, behind `voice`**; nothing
# here is built on Linux and `cargo tree` on a Linux target does not carry it.
#
# The feature list is the whole cost — win32metadata is generated per module and every module
# named here is compiled — so it is the smallest set that reaches the DSP:
#
# - `Win32_Media_DxMediaObjects`       `IMediaObject`, `IMediaBuffer`, `DMO_MEDIA_TYPE`
# - `Win32_Media_Audio`                `WAVEFORMATEX`
# - `Win32_UI_Shell_PropertiesSystem`  `IPropertyStore`, which is how the DSP is configured
# - `Win32_System_Com` and `_StructuredStorage` and `Win32_System_Variant`  `CoCreateInstance`,
#   `PROPVARIANT`
#
# **`Win32_Media_MediaFoundation` is deliberately absent**, and it is the largest module any of
# this could have pulled in. The only things needed from it were three well-known GUIDs —
# `MEDIATYPE_Audio`, `MEDIASUBTYPE_PCM`, `FORMAT_WaveFormatEx`. They are transcribed from a real
# `wmsdkidl.h` instead, and `win_aec.rs` carries the header's own text beside each one.
#
# There is no `implement` feature to ask for: `windows::core::implement` is unconditional in
# 0.62, which is what writes the `IMediaBuffer` vtable.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_DxMediaObjects",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The same crate `windows` re-exports as `windows::core`, named a second time **because
# `#[implement]` emits `::windows_core::` — an absolute path**, and an absolute path needs the
# crate to be a direct dependency. `use windows::core as windows_core` does not satisfy it;
# measured on Windows, 2026-09-15, as `could not find windows_core in the list of imported
# crates`. It is the same compiled copy, so this costs one manifest line and nothing else.
windows-core = "0.62.2"
# `=0.2.0`, not `^0.2.0`, for the six that come from the registry. Each of them depends on one of
# the crates patched below — `zyris-caps`, `zyris-core` — with a plain caret, and
# `[patch.crates-io]` pins those to a git rev whose version is 0.2.0. The day upstream publishes
# 0.2.1, a bare `cargo update` moves these six to it, their `^0.2.1` requirement stops being
# satisfied by the pinned 0.2.0, and they fall back to the registry copies — while `zyris-input`
# keeps reaching the git ones by path, since a path dependency inside a git checkout can never be
# patched away. Two copies again, and the error lands on the one line that hands a
# registry-sourced value to a git-sourced constructor.
# Upgrading is a nine-place edit: these six and the three patch entries, all together.
zyris = { version = "=0.2.0", default-features = false, features = ["caps", "client", "hostname", "enroll", "p2p"] }
# The `attacca_api` capability the server announces back. It is where `peer_publish` lives, which
# is how another of this account's machines learns where to dial this one — and `zyris` does not
# re-export it: the facade carries `caps` and `p2p` as modules and leaves this one a crate of its
# own, so a node that talks to Attacca names it directly.
zyris-attacca = "=0.2.0"
zyris-fs = "=0.2.0"
zyris-input = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "274e9af154071e878ea2cf30f7f90420b80ce742" }
zyris-screen = "=0.2.0"
zyris-terminal = "=0.2.0"
# `send` is `file_transfer.send_to` — the rendezvous client and the iroh dial. `listen` is the
# accept loop. Both, because this machine does both directions: upstream keeps them apart so a
# node can carry only the one it needs, and a desktop needs both. Together they reach `zyris-p2p`
# and through it iroh, which is the same copy `zyris`'s `p2p` feature above resolves — one
# registry `zyris-p2p`, so `IrohPeerLink::new` and `Peering`'s endpoint are the same `Endpoint`.
zyris-transfer = { version = "=0.2.0", features = ["send", "listen"] }

# Full debug info is what makes the link stage expensive on a 3.6 GB machine.
# `line-tables-only` keeps file and line in every backtrace frame and drops the rest.
[profile.dev]
debug = "line-tables-only"

# **The protocol stack comes from git, pinned to one rev, and it has to.**
#
# `zyris-input` is `publish = false` upstream — it pins a fork of `enigo` by rev, which crates.io
# will not take — so the only way to reach it is by git. Its own `zyris-core` and `zyris-caps`
# dependencies are path dependencies inside that checkout, and cargo treats a git-sourced crate
# and a registry-sourced one as different crates even at the same version. Without this patch the
# lockfile carries two copies of each and nothing composes:
#
#     error[E0277]: the trait bound `EnigoInput: Input` is not satisfied
#     note: there are multiple different versions of crate `zyris_caps` in the dependency graph
#
# Measured, not assumed. The patch collapses them to one copy each.
#
# Every entry must stay on the same rev as the `zyris-input` dependency above, or the problem
# comes back in a form that is harder to read.
[patch.crates-io]
zyris-core  = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "274e9af154071e878ea2cf30f7f90420b80ce742" }
zyris-caps  = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "274e9af154071e878ea2cf30f7f90420b80ce742" }
zyris-proto = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "274e9af154071e878ea2cf30f7f90420b80ce742" }
