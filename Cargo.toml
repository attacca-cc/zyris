[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is the first toolchain that understands edition 2024, which this workspace requires.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/attacca-cc/zyris"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-single-instance = "2.4.4"
tempfile = "3.24.0"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zyris = { version = "0.2.0", default-features = false, features = ["client", "hostname", "enroll"] }

# Full debug info is what makes the link stage expensive on a 3.6 GB machine.
# `line-tables-only` keeps file and line in every backtrace frame and drops the rest.
[profile.dev]
debug = "line-tables-only"
